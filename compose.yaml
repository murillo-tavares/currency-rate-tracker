services:

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=currency_rate_tracker'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=currency_rate_tracker'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency_rate_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - '8080:8080'
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/currency_rate_tracker
      DB_USERNAME: currency_rate_tracker
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '4200:80'
    depends_on:
      - backend
