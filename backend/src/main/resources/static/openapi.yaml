openapi: 3.0.3
info:
  title: Currency Rate Tracker API
  description: API de cotação de moedas. Catálogo de moedas suportadas e cotações atuais/históricas.
  version: "1.0.0"

servers:
  - url: /api/v1

tags:
  - name: Moeda
    description: Catálogo de moedas suportadas para cotação
  - name: Cotação
    description: Cotação atual e histórico de cotações das moedas
  - name: Usuário
    description: Cadastro de usuário
  - name: Autenticação
    description: Login e emissão de token JWT

paths:
  /moedas:
    get:
      tags: [Moeda]
      summary: Lista todas as moedas disponíveis para cotação
      operationId: listarMoedas
      responses:
        "200":
          description: Lista de moedas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoedaResponse"

  /cotacoes:
    get:
      tags: [Cotação]
      summary: Lista a cotação atual das moedas do catálogo (ou só as informadas)
      description: >-
        Servido a partir do banco (última cotação de cada moeda), com cache quando não há
        filtro por código.
      operationId: listarCotacoesAtuais
      parameters:
        - name: codigosMoeda
          in: query
          description: Códigos das moedas a filtrar. Sem filtro, retorna todas.
          required: false
          schema:
            type: array
            items:
              type: string
          example: [USD, EUR]
      responses:
        "200":
          description: Cotações atuais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CotacaoResponse"

  /cotacoes/dashboard:
    get:
      tags: [Cotação]
      summary: Dashboard de cotações (uma ou várias moedas) dentro de um intervalo de datas
      description: >-
        Agrupa o histórico de cotações em um gráfico por moeda. Sem `codigosMoeda`, considera
        todas as moedas do catálogo. Sem `inicio`, considera as últimas 24 horas.
      operationId: buscarDashboardCotacoes
      parameters:
        - name: codigosMoeda
          in: query
          description: Códigos das moedas a filtrar. Sem filtro, retorna todas.
          required: false
          schema:
            type: array
            items:
              type: string
          example: [USD, EUR]
        - name: inicio
          in: query
          description: Início do intervalo. Default as últimas 24 horas.
          required: false
          schema:
            type: string
            format: date-time
        - name: fim
          in: query
          description: Fim do intervalo. Sem default (sem limite superior).
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Dashboard de cotações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /usuarios:
    post:
      tags: [Usuário]
      summary: Cadastra um novo usuário
      operationId: cadastrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
      responses:
        "201":
          description: Usuário cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: Já existe um usuário cadastrado com esse email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica por email/senha e devolve um token JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Email ou senha inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

components:
  schemas:
    MoedaResponse:
      type: object
      properties:
        codigo:
          type: string
          example: USD
        nome:
          type: string
          example: Dólar Americano

    CotacaoResponse:
      type: object
      properties:
        codigoMoeda:
          type: string
          example: USD
        nome:
          type: string
          example: Dólar Americano
        valor:
          type: number
          example: 5.42
        variacaoPercentual:
          type: number
          example: 0.23
        dataCotacao:
          type: string
          format: date-time

    DashboardResponse:
      type: object
      properties:
        graficos:
          type: array
          items:
            $ref: "#/components/schemas/GraficoResponse"

    GraficoResponse:
      type: object
      properties:
        codigoMoeda:
          type: string
          example: USD
        pontos:
          type: array
          items:
            $ref: "#/components/schemas/PontoResponse"

    PontoResponse:
      type: object
      properties:
        valor:
          type: number
          example: 5.42
        variacaoPercentual:
          type: number
          example: 0.23
        dataCotacao:
          type: string
          format: date-time

    CadastroRequest:
      type: object
      required: [email, nome, senha]
      properties:
        email:
          type: string
          format: email
          example: usuario@exemplo.com
        nome:
          type: string
          example: Maria Silva
        senha:
          type: string
          format: password
          minLength: 6
          example: senha123

    UsuarioResponse:
      type: object
      properties:
        email:
          type: string
          format: email
          example: usuario@exemplo.com
        nome:
          type: string
          example: Maria Silva

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: usuario@exemplo.com
        senha:
          type: string
          format: password
          example: senha123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT, usado como `Authorization Bearer <token>` nos endpoints protegidos.

    Erro:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        codigo:
          type: string
          description: Código do erro de negócio (catálogo interno). Ausente em erros de framework/validação.
          nullable: true
          example: EMAIL_JA_CADASTRADO
        message:
          type: string
        path:
          type: string
